name: 更新博群診所候診資料
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-queue.yml'
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
concurrency:
  group: clinic-queue-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 檢查候診解析
        run: python -m unittest discover -s tests
      - name: 擷取原站數字
        run: python scripts/fetch_queue.py --output queue.json
      - name: 更新公開資料檔
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add queue.json
          if ! git diff --cached --quiet; then
            git commit -m '更新候診數字'
            git push origin HEAD:main
          fi
